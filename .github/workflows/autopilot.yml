name: AI Agent & Pain Point Radar Autopilot

on:
  workflow_dispatch:
    inputs:
      subreddits:
        description: 'Comma-separated Reddit communities'
        required: false
        default: 'SaaS,smallbusiness,SideProject'
      run_mode:
        description: 'Live collection or synthetic offline demonstration'
        type: choice
        options: [live, mock]
        default: live
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: radar-autopilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Queued scheduled/manual runs must include the previous run's CSV
          # commit rather than checking out an older event SHA.
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate V3 syntax and regression tests
        run: |
          git rev-parse HEAD
          python3 -m py_compile pain_point_radar_v3_anti_block.py
          python3 -m unittest discover -s tests -v

      - name: Run V3 collection or explicit mock demonstration
        id: scan
        env:
          RADAR_SUBREDDITS: ${{ inputs.subreddits || 'SaaS,smallbusiness,SideProject' }}
          RADAR_MODE: ${{ inputs.run_mode || 'live' }}
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          printf '### Pain Point Radar V3 (%s)\n' "$RADAR_MODE" >> "$GITHUB_STEP_SUMMARY"
          set +e
          if [ "$RADAR_MODE" = mock ]; then
            python3 pain_point_radar_v3_anti_block.py --mock-self-test 2>&1 | tee radar_run.log
          else
            python3 pain_point_radar_v3_anti_block.py --subreddits "$RADAR_SUBREDDITS" --limit 20 --retries 3 --output-csv radar_latest_scan.csv --generate-tweet 2>&1 | tee radar_run.log
          fi
          status=${PIPESTATUS[0]}
          set -e
          printf 'Exit code: %s\n\n```text\n' "$status" >> "$GITHUB_STEP_SUMMARY"
          cat radar_run.log >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Preserve scan output and diagnostics
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: radar-v3-${{ github.run_id }}
          path: |
            radar_run.log
            radar_latest_scan.csv
            pain_point_radar_batch_test.csv
          if-no-files-found: warn

      - name: Commit changed CSV ledgers
        if: ${{ always() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          for file in radar_latest_scan.csv pain_point_radar_batch_test.csv; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m 'chore(autopilot): update V3 radar ledgers'
            git push
          fi
